<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SSI Weekly HR Insight — 아카이브</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
         background:#f4f5f7;color:#273646;min-height:100vh}

    /* ── 헤더 (흰 배경, 모닝브리핑 스타일) ── */
    .site-header{background:#fff;border-bottom:1px solid #e2e8f0}
    .header-top{max-width:720px;margin:0 auto;padding:32px 32px 20px;
                display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
    .header-title-area{flex:1;min-width:0}
    .header-title-area h1{font-size:26px;font-weight:800;color:#273646;
                           letter-spacing:-.5px;line-height:1.25;margin-bottom:6px}
    .header-title-area .subtitle{font-size:13px;color:#94a3b8;font-weight:400}
    .header-title-area .intro-desc{font-size:13.5px;color:#5c6b78;font-weight:400;
                           line-height:1.6;margin-top:8px}
    .logo-img{height:28px;width:auto;max-width:140px;display:block;flex-shrink:0}
    .logo-text-fallback{font-size:16px;font-weight:800;color:#273646}

    /* 헤더 하단 버튼 행 */
    .header-actions{max-width:720px;margin:0 auto;padding:14px 32px 20px;
                    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
                    border-top:1px solid #e2e8f0}
    .btn-intro{display:inline-flex;align-items:center;gap:6px;
               background:#fff;color:#273646;font-size:13px;font-weight:500;
               border:1px solid #d1d5db;border-radius:8px;padding:8px 16px;
               text-decoration:none;transition:background .15s,border-color .15s;
               font-family:inherit}
    .btn-intro:hover{background:#f9fafb;border-color:#00BFB6;color:#00BFB6}

    /* 검색 바 */
    .search-bar{background:#fff;border-bottom:1px solid #e2e8f0}
    .search-inner{max-width:720px;margin:0 auto;padding:12px 32px;
                  display:flex;gap:12px;align-items:center}
    .search-inner input{flex:1;border:1.5px solid #e2e8f0;border-radius:9px;
                        padding:9px 16px;font-size:14px;outline:none;font-family:inherit;
                        transition:border-color .2s;color:#273646;background:#f8fafc}
    .search-inner input:focus{border-color:#00BFB6;background:#fff}
    .count-badge{font-size:13px;color:#94a3b8;white-space:nowrap}
    .count-badge strong{color:#00BFB6;font-weight:700}

    /* 메인 그리드 */
    .main{max-width:720px;margin:0 auto;padding:28px 32px}
    .letters-grid{display:grid;grid-template-columns:1fr;gap:20px}

    /* 카드 */
    .card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;overflow:hidden;
          box-shadow:0 1px 4px rgba(39,54,70,.06);
          transition:transform .2s ease,box-shadow .2s ease}
    .card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.08)}
    .card-header{background:#F4FDFC;padding:13px 20px;display:flex;align-items:center;
                justify-content:space-between;border-bottom:1px solid #DCEEEC}
    .card-date-header{font-size:13px;color:#273646;font-weight:600;letter-spacing:.2px}
    .card-no-badge{background:#00BFB6;color:#fff;font-size:11px;font-weight:700;
                   padding:3px 10px;border-radius:20px;letter-spacing:.3px}
    .card-body{padding:18px 20px 12px}
    .card-title{font-size:15px;font-weight:700;color:#273646;line-height:1.5;margin-bottom:8px}
    .card-cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .card-cat-tag{background:#EAF9F8;color:#00958D;font-size:11px;font-weight:600;
                  padding:3px 9px;border-radius:12px;letter-spacing:.1px}
    .card-excerpt{font-size:13px;color:#64748b;line-height:1.65;
                  display:-webkit-box;-webkit-line-clamp:3;
                  -webkit-box-orient:vertical;overflow:hidden}
    .card-footer{padding:10px 20px 16px;display:flex;gap:8px}
    .btn-read{background:#00BFB6;color:#fff;border:none;border-radius:7px;
              padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;
              font-family:inherit;transition:background .15s}
    .btn-read:hover{background:#00A29B}
    .btn-collapse{background:#f1f5f9;color:#64748b;border:none;border-radius:7px;
                  padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit;
                  display:none;transition:background .15s}
    .btn-collapse:hover{background:#e2e8f0}

    /* 전문 읽는 중 떠 있는 접기 버튼 — 스크롤해도 고정, 읽기 방해 없는 우하단 */
    .floating-collapse{position:fixed;right:24px;bottom:24px;z-index:50;
                       display:none;align-items:center;gap:6px;
                       background:#273646;color:#fff;border:none;border-radius:24px;
                       padding:11px 20px;font-size:13px;font-weight:600;cursor:pointer;
                       font-family:inherit;box-shadow:0 6px 20px rgba(39,54,70,.28);
                       opacity:0;transform:translateY(8px);
                       transition:opacity .2s ease,transform .2s ease,background .15s}
    .floating-collapse.show{display:inline-flex;opacity:1;transform:translateY(0)}
    .floating-collapse:hover{background:#00A29B}

    /* 전문 */
    .card-full{display:none;border-top:3px solid #00BFB6;background:#fff}
    .card-toc{display:flex;flex-wrap:wrap;gap:8px;padding:16px 26px;
             background:#FAFEFE;border-bottom:1px solid #DCEEEC}
    .card-toc button{background:#fff;border:1px solid #00BFB6;color:#00958D;
                     font-size:12px;font-weight:600;padding:5px 12px;border-radius:14px;
                     cursor:pointer;font-family:inherit;transition:background .15s}
    .card-toc button:hover{background:#F4FDFC}
    .card-full-inner{padding:22px 26px 22px}
    .card-full h1{font-size:20px;font-weight:800;color:#273646;margin:28px 0 12px;
                  padding-bottom:8px;border-bottom:2px solid #00BFB6}
    .card-full h2{font-size:17px;font-weight:700;color:#273646;margin:22px 0 10px}
    .card-full h3{font-size:13px;font-weight:700;color:#00BFB6;margin:16px 0 8px;
                  text-transform:uppercase;letter-spacing:.6px}
    .card-full p{margin:0 0 14px;line-height:1.8;color:#273646;font-size:15px}
    .card-full ul,.card-full ol{margin:0 0 14px;padding-left:22px}
    .card-full li{margin-bottom:7px;line-height:1.7;color:#273646}
    .card-full hr{border:none;border-top:1px solid #DCEEEC;margin:32px 0}
    .card-full blockquote,.card-full table td{background:#f9fafb;border-left:4px solid #00BFB6;
      padding:12px 18px;color:#5c6b78;font-style:italic;border-radius:0 8px 8px 0;line-height:1.75}
    .card-full table{width:100%;margin-bottom:14px;border-collapse:collapse}
    .card-full pre{background:#273646;color:#e5e7eb;border-radius:10px;padding:16px 20px;
                   margin:0 0 14px;overflow-x:auto;font-size:13px;line-height:1.6;
                   font-family:'Courier New',monospace}
    .card-full img{max-width:100%;border-radius:10px}
    .card-full code{background:#F4FDFC;color:#00BFB6;padding:2px 5px;border-radius:3px;
                    font-size:88%;font-family:monospace}

    .empty-state{text-align:center;padding:72px 24px;color:#94a3b8}
    .empty-state .emoji{font-size:44px;margin-bottom:14px}
    .site-footer{text-align:center;padding:28px 24px;color:#94a3b8;font-size:12px;
                 border-top:1px solid #e2e8f0;margin-top:12px;background:#fff}
    .site-footer a{color:#00BFB6;text-decoration:none}

    @media(max-width:680px){
      .letters-grid{grid-template-columns:1fr}
      .header-top{flex-direction:column;padding:20px 18px 16px}
      .header-actions{padding:12px 18px 16px}
      .search-inner,.main{padding-left:18px;padding-right:18px}
      .card-full-inner{padding:18px 16px}
      .card-toc{padding:12px 16px}
      .floating-collapse{right:16px;bottom:16px;padding:10px 16px}
    }
  </style>
</head>

  <div class="header-top">
    <!-- 좌: 타이틀 + 부제 -->

<!-- 전문 읽는 중 떠 있는 접기 버튼 (스크롤해도 고정) -->
<button class="floating-collapse" id="floatingCollapse" onclick="collapseOpen()">접기 ↑</button>

<script>
let allLetters=[];
async function loadData(){
  try{const r=await fetch("letters_archive.json?t="+Date.now());
      if(!r.ok)throw 0;allLetters=await r.json();}
  catch{allLetters=[];}
  renderGrid(allLetters);
}
function fmtDate(s){
  return new Date(s+"T00:00:00+09:00")
    .toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"});
}
function escHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
const CATEGORIES=["채용·인력","정책·법제","보상·평가","노무·컴플라이언스","노동시장·통계","HR Tech·AI"];
function extractCategories(html){
  if(!html)return[];
  const found=[...html.matchAll(/<h3[^>]*>([^<]+)<\/h3>/g)].map(m=>m[1].trim());
  return CATEGORIES.filter(c=>found.includes(c));
}
function renderGrid(letters){
  const grid=document.getElementById("grid"),empty=document.getElementById("emptyState");
  document.getElementById("letterCount").textContent=letters.length;
  openIdx=null;document.getElementById("floatingCollapse").classList.remove("show");
  if(!letters.length){grid.innerHTML="";empty.style.display="block";return;}
  empty.style.display="none";
  grid.innerHTML=letters.map((l,idx)=>`
    <article class="card">
      <div class="card-header">
        <div class="card-date-header">${fmtDate(l.date)}</div>
        <div class="card-no-badge">No.${l.number ?? (letters.length-idx)}</div>
      </div>
      <div class="card-body">
        <div class="card-title">${escHtml(l.title)}</div>
        ${extractCategories(l.html_content).length?`<div class="card-cats">${extractCategories(l.html_content).map(c=>`<span class="card-cat-tag">${escHtml(c)}</span>`).join("")}</div>`:""}
        <div class="card-excerpt">${escHtml(l.excerpt||"")}</div>
      </div>
      <div class="card-footer">
        <button class="btn-read" onclick="expand(this,${idx})">전문 읽기 ↓</button>
        <button class="btn-collapse" onclick="collapse(this,${idx})">접기 ↑</button>
      </div>
      <div class="card-full" id="full-${idx}"></div>
    </article>`).join("");
}
let openIdx=null;
function buildToc(full,idx){
  const inner=full.querySelector(".card-full-inner");
  const headings=[...inner.querySelectorAll("h3")].filter(h=>CATEGORIES.includes(h.textContent.trim()));
  if(!headings.length)return;
  const nav=document.createElement("div");
  nav.className="card-toc";
  headings.forEach((h,i)=>{
    const id=`cat-${idx}-${i}`;
    h.id=id;
    const b=document.createElement("button");
    b.type="button";
    b.textContent=h.textContent.trim();
    b.onclick=()=>document.getElementById(id).scrollIntoView({behavior:"smooth",block:"start"});
    nav.appendChild(b);
  });
  full.insertBefore(nav,inner);
}
function expand(btn,idx){
  const full=document.getElementById("full-"+idx);
  if(!full.dataset.loaded){
    const html=allLetters[idx].html_content||"<p>본문 없음</p>";
    full.innerHTML=`<div class="card-full-inner">${html}</div>`;
    buildToc(full,idx);
    full.dataset.loaded=1;
  }
  full.style.display="block";btn.style.display="none";
  btn.nextElementSibling.style.display="inline-flex";
  full.scrollIntoView({behavior:"smooth",block:"start"});
  openIdx=idx;
  document.getElementById("floatingCollapse").classList.add("show");
}
function collapse(btn,idx){
  document.getElementById("full-"+idx).style.display="none";
  btn.style.display="none";btn.previousElementSibling.style.display="inline-flex";
  if(openIdx===idx){openIdx=null;document.getElementById("floatingCollapse").classList.remove("show");}
}
function collapseOpen(){
  if(openIdx===null)return;
  const idx=openIdx;
  const full=document.getElementById("full-"+idx);
  const card=full.closest(".card");
  const collapseBtn=card.querySelector(".btn-collapse");
  collapse(collapseBtn,idx);
  card.scrollIntoView({behavior:"smooth",block:"start"});
}
document.getElementById("searchInput").addEventListener("input",function(){
  const q=this.value.trim().toLowerCase();
  if(!q){renderGrid(allLetters);return;}
  renderGrid(allLetters.filter(l=>
    l.title.toLowerCase().includes(q)||
    (l.excerpt||"").toLowerCase().includes(q)||
    (l.html_content||"").toLowerCase().includes(q)));
});
loadData();
</script>
